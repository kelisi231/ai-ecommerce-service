[project]
name = "your-project-name"
version = "0.1.0"
description = "Your project description"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
    "asyncmy",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langgraph",
    "langchain-openai",
    "elasticsearch>=8.0.0,<9.0.0",
    "qdrant-client",
    "langchain-qdrant",
    "httpx",
    "python-multipart",
    "pymupdf",
    "python-docx",
    "loguru",
    "omegaconf>=2.3.1",
    "langchain-cohere>=0.6.0",
    "joblib>=1.5.3",
    "accelerate>=1.14.0",
    "sentence-transformers>=5.0.0",
    "cryptography>=50.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
]
